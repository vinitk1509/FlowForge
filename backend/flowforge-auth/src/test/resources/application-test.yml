server:
  port: 8081

spring:
  application:
    name: flowforge-auth-test
  datasource:
    url: jdbc:h2:mem:auth_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

flowforge:
  jwt:
    secret: FlowForgeSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong!
    access-token-expiration-ms: 86400000
    refresh-token-expiration-ms: 604800000
