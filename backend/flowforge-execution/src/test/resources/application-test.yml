spring:
  application:
    name: flowforge-execution-test

  datasource:
    url: jdbc:h2:mem:execution_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  kafka:
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.flowforge.*"

  data:
    redis:
      repositories:
        enabled: false

flowforge:
  services:
    workflow-url: http://localhost:8082
