server:
  port: 8080

spring:
  application:
    name: flowforge-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: workflow-service
          uri: ${WORKFLOW_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/workflows/**
          filters:
            - name: JwtAuthentication

flowforge:
  jwt:
    secret: ${JWT_SECRET:FlowForgeSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong!}
